[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantdum"
version = "0.0.1"
description = "Multiple purpose discord bot."
requires-python = ">=3.11"
dependencies = [
    "discord.py==2.4.0",
    "python-dotenv",
    "pydantic",
    "sqlmodel==0.0.22",
]

[project.optional-dependencies]
dev = [
    "black",   # Formatter
    "ruff",    # Linter
    "isort",   # Import sorter
    "pyright", # Type checker
]

[tool.setuptools.packages.find]
# where = ["."]
include = ["bot"]
# exclude = [".venv*", ".env*", "scripts", "build"]

[tool.black]
line-length = 88
